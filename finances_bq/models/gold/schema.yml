version: 2

models:
  - name: agg_pago_por_hora
    description: >
      Tabla agregada de nivel Gold que calcula el rendimiento económico del tiempo trabajado.
      Cruza los ingresos por salario con los descuentos de ley (AFP, Impuestos) y las horas efectivas
      para determinar el pago neto por hora.
    columns:
      # --- DIMENSIONES TEMPORALES ---
      - name: anio
        description: "Año de la transacción salarial."
      - name: mes
        description: "Mes numérico del periodo laborado."

      # --- MÉTRICAS DE TIEMPO (Productividad) ---
      - name: dias_trabajados_mes
        description: >
          Suma total de días laborados reportados en el mes. 
          Calculado mediante la agregación del campo 'dias_trabajados' de fact_transactions.
      
      - name: dias_trabajados_neto
        description: >
          Ajuste de días laborados usando un factor de eficiencia (72.3%). 
          Representa el tiempo efectivo de trabajo quitando tiempos muertos o administrativos.

      - name: horas_trabajadas
        description: "Equivalente en horas de los 'dias_trabajados_neto' (asumiendo jornada de 8h)."

      # --- MÉTRICAS FINANCIERAS (Nómina) ---
      - name: bruto_mensual
        description: >
          Suma de todos los ingresos bajo la categoría 'Salario' para el mes y moneda específica.
      
      - name: descuentos
        description: >
          Suma de deducciones (Aporte AFP, Seguro AFP, Quinta Categoría) identificadas en el concepto.
      
      - name: neto_mensual
        description: "Ingreso real percibido después de impuestos y aportes (Bruto - Descuentos)."

      - name: pago_por_hora
        description: >
          Métrica clave: Valor monetario de una hora efectiva de trabajo. 
          Calculado como: neto_mensual / horas_trabajadas.

      - name: moneda
        description: "Divisa del cálculo. Permite separar salarios en diferentes monedas (ej. USD vs PEN)."





  - name: agg_costo_en_vida
    description: >
      Tabla de nivel Gold que traduce los gastos monetarios a 'Costo de Vida' en horas.
      Utiliza el pago neto por hora del mes correspondiente (o el más reciente disponible) 
      para calcular cuánto tiempo de vida costó cada transacción.
    columns:
      # --- DIMENSIONES ---
      - name: txn_id
        description: "ID único de la transacción original (proviene de fact_transactions)."

      - name: categoria
        description: "Categoría del gasto (ej. Alimentación, Salud, Ocio)."

      - name: importe_moneda_principal
        description: "Monto del gasto expresado en la moneda base (PEN)."

      # --- MÉTRICAS DE TIEMPO DE VIDA ---
      - name: pago_por_hora
        description: >
          Tasa de pago utilizada para el cálculo. 
          Prioriza el pago neto del mes de la transacción; si no existe, 
          utiliza el último salario registrado en agg_pago_por_hora.

      - name: costo_en_horas
        description: >
          Métrica principal: Representa cuántas horas de trabajo efectivo costó este gasto.
          Cálculo: importe_moneda_principal / pago_por_hora.

        #tests:
        #  - dbt_utils.accepted_range:
        #      max_value: 300utils

      - name: horas_trabajadas
        description: >
          Referencia de la capacidad laboral del periodo. 
          Ayuda a poner en contexto el 'costo_en_horas' frente al total de horas laboradas.

      # --- AUDITORÍA ---
      - name: fecha_carga
        description: "Timestamp de la carga incremental para trazabilidad de datos."

  - name: agg_netos_prestamos_anuncios
    description: >
      Neteo mensual de dos categorías que en fact_transactions viven mezcladas con su
      contraparte de 'Reembolsos': Préstamos (micro-adelantos a conocidos, identificados por
      comentario 'C/<Nombre>') y Anuncios (publicidad reembolsada, concepto 'Ads%'). Lo no
      neteado (sin contraparte en el mismo mes) cuenta como gasto/pérdida real.
    columns:
      - name: mes
        description: "Mes (primer día) del neteo."
      - name: neto_prestamos_terceros
        description: "SUM(Préstamos) - SUM(Reembolsos) agrupado por persona/mes; sin contraparte queda como gasto completo."
      - name: neto_anuncios
        description: "SUM(Anuncios) - SUM(Reembolsos con concepto LIKE 'Ads%') del mes."
      - name: neto_prestamos_terceros_horas
        description: "neto_prestamos_terceros convertido a horas de trabajo equivalentes (mismo criterio que agg_costo_en_vida)."
      - name: neto_anuncios_horas
        description: "neto_anuncios convertido a horas de trabajo equivalentes."

  - name: agg_gasto_esencial
    description: >
      Fuente única de la lista canónica de categorías "esenciales de supervivencia"
      (macro categorias_esenciales_supervivencia), para que /crecimiento-kpis,
      /gasto-esencial-discrecional y /libertad-financiera dejen de divergir. Suma el
      componente real de interés+seguros de hipoteca (vivienda propia) desde
      hipotecas_materialized, y usa los netos de agg_netos_prestamos_anuncios en vez de los
      brutos de Préstamos/Anuncios.
    columns:
      - name: mes
        description: "Mes (primer día)."
      - name: gasto_esencial_real
        description: "Gasto real (fact_transactions) en categorías esenciales + interés/seguros de hipoteca (vivienda propia) del mes."
      - name: gasto_discrecional_real
        description: "Gasto real discrecional (excluye esencial, Inversiones, Deudas) + netos de Préstamos/Anuncios del mes."
      - name: presupuesto_esencial
        description: "Presupuesto planeado (presupuesto_materialized) en categorías esenciales + interés/seguros de hipoteca (vivienda propia) del mes."
      - name: neto_prestamos_terceros
        description: "Ver agg_netos_prestamos_anuncios."
      - name: neto_anuncios
        description: "Ver agg_netos_prestamos_anuncios."

  - name: cuentas_alto_rendimiento
    description: >
      Materializa el macro cuentas_alto_rendimiento() como tabla real en BigQuery, para que
      dashboard_api consulte esta lista por SELECT en vez de hardcodear el literal de cuentas
      en Python. Única fuente de verdad de la lista: el macro (macros/cuentas_alto_rendimiento.sql).
    columns:
      - name: cuenta
        description: "Nombre de una cuenta de ahorro de alto rendimiento (ej. 'Wow Compartamos')."

  - name: agg_gasto_mensual_categoria
    description: >
      Grano mes x categoría de gasto real (fact_transactions), sin whitelist ni neteo de
      Anuncios/Préstamos contra Reembolsos — ambos se aplican en dashboard_api. Fuente para
      comparativas year-over-year: crecimiento de ingreso neto (junto con agg_ingresos) e
      "inflación de estilo de vida" por categoría entre años.
    columns:
      - name: mes_cat_id
        description: "Hash MD5 de mes + categoría, unique_key del merge incremental."
      - name: mes
        description: "Mes (primer día, DATETIME), DATE_TRUNC(txn_time, MONTH)."
      - name: categoria
        description: "Categoría tal cual viene en fact_transactions, sin normalizar."
      - name: monto_real
        description: "SUM(importe_moneda_principal) del mes/categoría donde ingreso_gasto = 'Gastos'."
      - name: fecha_carga
        description: "Última fecha_carga del batch que aportó datos a esta fila."

  - name: plan_inversion
    description: >
      Modelo Gold que calcula la distribución mensual del dinero disponible para ahorro e inversión
      después de restar los gastos proyectados y la cuota de la hipoteca. Define asignaciones específicas
      para cuenta de alto rendimiento (27%), amortización de hipoteca (10%) y Fibras (63%, dividido en FIBPRIME y FIBCCAP).
    columns:
      - name: fecha
        description: "Fecha del mes correspondiente (primer día del mes)."
        tests:
          - not_null
          - unique
      - name: month_id
        description: "Identificador numérico del mes en formato YYYYMM."
        tests:
          - not_null
          - unique
      - name: bruto_mensual
        description: "Suma total de los ingresos mensuales (Salario, Freelance, Pasivo)."
      - name: neto_mensual_estimado
        description: "Ingresos netos estimados mensuales (Bruto menos Impuestos, Jubilación y Comisiones)."
      - name: neto_despues_de_vida
        description: "Ingreso neto disponible después de restar el gasto proyectado para el mes (El gasto proyectado es la suma de todos los presupuestos excluyendo las deudas e hipotecas y agregando un colchón del 18% sobre ese importe)."
      - name: cuota_mensual
        description: "Monto de la cuota de hipoteca correspondiente al mes. Cruzado con hipotecas_materialized"
      - name: disponible_ahorro_inversion
        description: "Monto neto final disponible para ahorro e inversión (neto_despues_de_vida menos cuota_mensual)."
      - name: cuenta_alto_rendimiento
        description: "Monto del disponible destinado a cuenta de ahorro de alto rendimiento (27%)."
      - name: amortizacion_hipoteca
        description: "Monto del disponible destinado a prepago o amortización de la hipoteca (10%)."
      - name: fibras
        description: "Monto total destinado a inversión en FIBRAS (63%)."
      - name: fibprime
        description: "Monto asignado a FIBPRIME (70% del presupuesto total de Fibras)."
      - name: fibccap
        description: "Monto asignado a FIBCCAP (30% del presupuesto total de Fibras)."